[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "defocus-bayesian"
version = "1.0.0"
description = "Defocus Dose - Choroidal Response Bayesian Analysis System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Defocus Bayesian Team"}
]
keywords = [
  "bayesian-inference",
  "medical-imaging",
  "dose-response",
  "pymc",
  "myopia-control",
  "active-learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "pymc>=5.10",
  "arviz>=0.17",
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "scikit-learn>=1.3",
  "tqdm>=4.65",
  "jax>=0.4",
  "jaxlib>=0.4",
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "black",
  "isort",
  "pytest>=7.0",
  "pytest-cov",
  "mypy",
  "flake8",
]

[project.scripts]
defocus-analyze = "src.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line-length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
length_sort = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
